<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wayne Tech - Login</title>
    <!-- FAVICON ATUALIZADO -->
    <link rel="icon" type="image/png" href="w-azul.png">
    <style>
       * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background-color: #000000;
    color: #ffffff;
    min-height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    
    background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('wayne-enterprises-wallpapers.jpg');
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
    background-attachment: fixed;
    transition: background-color 0.4s ease, border-color 0.4s ease;
}

/* NAVBAR */
.navbar {
    background: rgba(10, 15, 25, 0.85);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: all 0.3s ease;
}

.navbar-brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-wayne {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
}

.navbar-brand h1 {
    font-size: 1.3rem;
    color: #1ea1e1;
    letter-spacing: 1px;
    font-weight: 700;
}

.user-info {
    display: flex;
    align-items: center;
    gap: 20px;
}

.user-name {
    font-size: 0.95rem;
    color: #cbd5e1;
    font-weight: 500;
}

.btn-logout {
    background: rgba(239, 68, 68, 0.2);
    border: 1px solid #ef4444;
    color: #fca5a5;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85rem;
    transition: all 0.2s;
}

.btn-logout:hover {
    background: #ef4444;
    color: #ffffff;
}

/* CONTEÚDO PRINCIPAL */
.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 20px;
    width: 100%;
}

/* CARD DE BOAS-VINDAS */
.welcome-card {
    background: rgba(15, 20, 30, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 30px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: all 0.3s ease;
}

.welcome-card h2 {
    font-size: 1.4rem;
    margin-bottom: 8px;
    color: #ffffff;
}

.welcome-card p {
    color: #94a3b8;
    font-size: 0.95rem;
}

/* BARRA DE AÇÕES & GRUPO DE BOTÕES */
.actions-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 15px;
}

.actions-bar h3 {
    font-size: 1.2rem;
    color: #f8fafc;
}

.btn-group {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

/* BOTÃO DE ALTERNÂNCIA DE VISÃO (EXCLUSIVO BRUCE WAYNE) */
.btn-toggle-mode {
    background: #0284c7; /* Azul padrão */
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
}

.btn-toggle-mode:hover {
    background: #0369a1;
}

/* ESTADO ATIVO DO MODO VIGILANTE (PRETO) */
.btn-toggle-mode.mode-vigilante {
    background: #000000;
    color: #38bdf8;
    border: 1px solid #0284c7;
    box-shadow: 0 0 12px rgba(2, 132, 199, 0.5);
}

.btn-toggle-mode.mode-vigilante:hover {
    background: #0f172a;
}

/* BOTÃO CHAMAR ALFRED (DENTRO DO MODO VIGILANTE) */
.btn-alfred {
    background: rgba(100, 116, 139, 0.2);
    border: 1px solid #94a3b8;
    color: #f1f5f9;
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
}

.btn-alfred:hover {
    background: #475569;
}

/* BOTÃO PROTOCOLO BATCAVERNA (DENTRO DO MODO VIGILANTE) */
.btn-batcave {
    background: #eab308;
    color: #000000;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 0 10px rgba(234, 179, 8, 0.3);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
}

.btn-batcave:hover {
    background: #ca8a04;
    box-shadow: 0 0 15px rgba(234, 179, 8, 0.6);
}

/* BOTÃO PADRÃO ADICIONAR RECURSO */
.btn-create {
    background: #0284c7;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
}

.btn-create:hover {
    background: #0369a1;
}

/* BOTÃO USO REMOTO DE EMERGÊNCIA (EXCLUSIVO ALFRED/FUNCIONÁRIO) */
.btn-emergency {
    background: rgba(220, 38, 38, 0.85);
    color: white;
    border: 1px solid #ef4444;
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
}

.btn-emergency:hover {
    background: #dc2626;
    box-shadow: 0 0 15px rgba(239, 68, 68, 0.7);
}

/* MODO TÁTICO BATCAVERNA (APLICADO AO BODY QUANDO ATIVADO) */
body.batcave-theme {
    background-color: #030712 !important;
    background-image: none !important;
}

body.batcave-theme .welcome-card,
body.batcave-theme .resource-card,
body.batcave-theme .navbar {
    border-color: #eab308 !important;
    box-shadow: 0 0 15px rgba(234, 179, 8, 0.15);
}

/* GRID DE CARDS DOS RECURSOS */
.resources-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
}

.resource-card {
    background: rgba(15, 20, 30, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 10px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: border-color 0.2s, transform 0.2s;
}

.resource-card:hover {
    border-color: rgba(30, 161, 225, 0.4);
    transform: translateY(-2px);
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
}

.card-title {
    font-size: 1.1rem;
    color: #1ea1e1;
    font-weight: 600;
}

.card-desc {
    color: #cbd5e1;
    font-size: 0.9rem;
    margin-bottom: 20px;
    line-height: 1.4;
}

.card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.badge-level {
    background: rgba(255, 255, 255, 0.08);
    color: #94a3b8;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.5px;
}

.btn-delete {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #fca5a5;
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.2s;
}

.btn-delete:hover {
    background: #ef4444;
    color: white;
}

.btn-remote-card {
    background: rgba(234, 179, 8, 0.15);
    border: 1px solid rgba(234, 179, 8, 0.5);
    color: #fef08a;
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    transition: all 0.2s;
}

.btn-remote-card:hover {
    background: #eab308;
    color: #000;
}

/* MODAL DE CRIAÇÃO */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(4px);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal {
    background: #0f172a;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    padding: 30px;
    width: 90%;
    max-width: 450px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.8);
}

.modal h3 {
    margin-bottom: 20px;
    color: #1ea1e1;
}

.modal .form-group {
    margin-bottom: 16px;
}

.modal label {
    display: block;
    margin-bottom: 6px;
    font-size: 0.85rem;
    color: #cbd5e1;
}

.modal input, .modal select, .modal textarea {
    width: 100%;
    padding: 10px;
    background: #1e293b;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 6px;
    color: white;
    outline: none;
}

.modal textarea {
    resize: vertical;
    height: 80px;
}

.modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 20px;
}

.btn-cancel {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #cbd5e1;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
}

.btn-cancel:hover {
    background: rgba(255, 255, 255, 0.05);
}

.loading-state, .empty-state {
    text-align: center;
    padding: 40px;
    color: #94a3b8;
    grid-column: 1 / -1;
}
    </style>
</head>
<body>

    <div class="login-container">
        <div class="header">
            <div class="header-brand">
                <img src="icone W.jpeg" alt="Logo Wayne Tech" class="logo-wayne">
                <h1>WAYNE TECH</h1>
            </div>
            <p>Sistema de Gerenciamento de Segurança</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail de Acesso</label>
                <input type="email" id="email" required placeholder="ex: bruce@wayne.com">
            </div>

            <div class="form-group">
                <label for="senha">Chave de Segurança (Senha)</label>
                <input type="password" id="senha" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-primary">AUTENTICAR</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const errorDiv = document.getElementById('errorMessage');

            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();

                    errorDiv.style.display = 'none';
                    errorDiv.textContent = '';

                    const email = document.getElementById('email').value;
                    const senha = document.getElementById('senha').value;

                    try {
                        const response = await fetch('https://wayne-tech-api.onrender.com/api/login', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ email, senha })
                        });

                        const data = await response.json();

                        if (response.ok) {
                            localStorage.setItem('token', data.token);
                            localStorage.setItem('usuario', JSON.stringify(data.usuario));
                            window.location.href = 'dashboard.html';
                        } else {
                            errorDiv.textContent = data.erro || 'Credenciais inválidas!';
                            errorDiv.style.display = 'block';
                        }
                    } catch (error) {
                        console.error('Erro na requisição:', error);
                        errorDiv.textContent = 'Erro de conexão com o servidor Wayne Tech.';
                        errorDiv.style.display = 'block';
                    }
                });
            }
        });
    </script>
</body>
</html>
