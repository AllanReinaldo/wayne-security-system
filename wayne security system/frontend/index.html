<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wayne Tech - Login</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f59e0b'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8 0-1.84.63-3.53 1.69-4.88 1.48 1.83 3.97 3.38 6.31 3.38s4.83-1.55 6.31-3.38C19.37 8.47 20 10.16 20 12c0 4.41-3.59 8-8 8z'/></svg>">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background: #121824;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #f59e0b;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: #1a2332;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #f59e0b;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #f59e0b;
            border: none;
            border-radius: 6px;
            color: #000000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #d97706;
        }

        .error-message {
            display: none;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="header">
            <h1>🦇 WAYNE TECH</h1>
            <p>Sistema de Gerenciamento de Segurança</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail de Acesso</label>
                <input type="email" id="email" required placeholder="ex: bruce@wayne.com">
            </div>

            <div class="form-group">
                <label for="senha">Chave de Segurança (Senha)</label>
                <input type="password" id="senha" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-primary">AUTENTICAR</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const errorDiv = document.getElementById('errorMessage');

            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();

                    // Limpa mensagens de erro prévias
                    errorDiv.style.display = 'none';
                    errorDiv.textContent = '';

                    const email = document.getElementById('email').value;
                    const senha = document.getElementById('senha').value;

                    try {
                        const response = await fetch('https://wayne-tech-api.onrender.com/api/login', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ email, senha })
                        });

                        const data = await response.json();

                        if (response.ok) {
                            // Armazena credenciais e redireciona
                            localStorage.setItem('token', data.token);
                            localStorage.setItem('usuario', JSON.stringify(data.usuario));
                            window.location.href = 'dashboard.html';
                        } else {
                            // Exibe erro retornado pela API
                            errorDiv.textContent = data.erro || 'Credenciais inválidas!';
                            errorDiv.style.display = 'block';
                        }
                    } catch (error) {
                        console.error('Erro na requisição:', error);
                        errorDiv.textContent = 'Erro de conexão com o servidor Wayne Tech.';
                        errorDiv.style.display = 'block';
                    }
                });
            }
        });
    </script>
</body>
</html>
