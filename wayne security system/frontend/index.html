<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wayne Tech - Login & Galeria</title>
    
    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="w-azul.png">

    <!-- ARQUIVO CSS EXTERNO -->
    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px; 
            
            background-image: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('wayne-enterprises-wallpapers.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
        }

        /* CARD DE LOGIN */
        .login-card {
            background: rgba(10, 15, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 40px 35px;
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(2, 132, 199, 0.1);
            text-align: center;
            margin-bottom: 40px;
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .logo-wayne {
            width: 40px !important;
            height: 40px !important;
            max-width: 40px !important;
            max-height: 40px !important;
            border-radius: 50%;
            object-fit: cover;
            background-color: #000;
            mix-blend-mode: multiply;
        }

        .brand-header h1 {
            font-size: 1.6rem;
            color: #1ea1e1;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 28px;
            letter-spacing: 0.5px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #cbd5e1;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #0284c7;
            box-shadow: 0 0 8px rgba(2, 132, 199, 0.4);
            background: rgba(30, 41, 59, 0.9);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: #0369a1;
            box-shadow: 0 0 12px rgba(2, 132, 199, 0.4);
        }

        .error-message {
            margin-top: 15px;
            color: #ef4444;
            font-size: 0.85rem;
            display: none;
        }

        /* CONTAINER PRINCIPAL DA GALERIA */
        .gallery-container {
            width: 100%;
            max-width: 1200px;
        }

        .gallery-title {
            text-align: center;
            font-size: 1.5rem;
            color: #f59e0b;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* RESPONSIVIDADE (SMARTPHONES E TABLETS) */
        @media (max-width: 480px) {
            .login-card {
                padding: 25px 20px;
            }

            .brand-header h1 {
                font-size: 1.3rem;
            }

            .form-group input, .btn-login {
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- CARD DE LOGIN -->
    <div class="login-card">
        <div class="brand-header">
            <img src="icone W.jpeg" alt="Logo Wayne Tech" class="logo-wayne">
            <h1>WAYNE TECH</h1>
        </div>
        <p class="subtitle">Sistema de Gerenciamento de Segurança</p>

        <form id="formLogin">
            <div class="form-group">
                <label for="email">E-mail de Acesso</label>
                <input type="email" id="email" required placeholder="ex: bruce@wayne.com">
            </div>

            <div class="form-group">
                <label for="senha">Chave de Segurança (Senha)</label>
                <input type="password" id="senha" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-login" id="btnSubmit">AUTENTICAR</button>
            <div class="error-message" id="msgErro"></div>
        </form>
    </div>

    <!-- SEÇÃO DA GRADE DE VILÕES -->
    <section class="gallery-container">
        <h2 class="gallery-title">Arquivo de Ameaças - Gotham</h2>
        
        <div class="villains-grid">

            <!-- Bane -->
            <div class="villain-card">
                <div class="villain-img-wrapper">
                    <img class="villain-img" src="bane.jpg" alt="Bane">
                </div>
                <div class="villain-info">
                    <h3 class="villain-name">Bane</h3>
                </div>
            </div>

            <!-- Charada -->
            <div class="villain-card">
                <div class="villain-img-wrapper">
                    <img class="villain-img" src="charada.jpg" alt="Charada">
                </div>
                <div class="villain-info">
                    <h3 class="villain-name">Charada</h3>
                </div>
            </div>

            <!-- Coringa -->
            <div class="villain-card">
                <div class="villain-img-wrapper">
                    <img class="villain-img" src="coringa.jpg" alt="Coringa">
                </div>
                <div class="villain-info">
                    <h3 class="villain-name">Coringa</h3>
                </div>
            </div>

            <!-- Corte das Corujas -->
            <div class="villain-card">
                <div class="villain-img-wrapper">
                    <img class="villain-img" src="corte-das-corujas.jpg" alt="Corte das Corujas">
                </div>
                <div class="villain-info">
                    <h3 class="villain-name">Corte das Corujas</h3>
                </div>
            </div>

            <!-- Duas-Caras -->
            <div class="villain-card">
                <div class="villain-img-wrapper">
                    <img class="villain-img" src="duas-caras.jpg" alt="Duas-Caras">
                </div>
                <div class="villain-info">
                    <h3 class="villain-name">Duas-Caras</h3>
                </div>
            </div>

            <!-- Espantalho -->
            <div class="villain-card">
                <div class="villain-img-wrapper">
                    <img class="villain-img" src="espantalho.jpg" alt="Espantalho">
                </div>
                <div class="villain-info">
                    <h3 class="villain-name">Espantalho</h3>
                </div>
            </div>

            <!-- Exterminador -->
            <div class="villain-card">
                <div class="villain-img-wrapper">
                    <img class="villain-img" src="exterminador.jpg" alt="Exterminador">
                </div>
                <div class="villain-info">
                    <h3 class="villain-name">Exterminador</h3>
                </div>
            </div>

            <!-- Hera Venenosa -->
            <div class="villain-card">
                <div class="villain-img-wrapper">
                    <img class="villain-img" src="hera-venenosa.jpg" alt="Hera Venenosa">
                </div>
                <div class="villain-info">
                    <h3 class="villain-name">Hera Venenosa</h3>
                </div>
            </div>

            <!-- Mulher-Gato -->
            <div class="villain-card">
                <div class="villain-img-wrapper">
                    <img class="villain-img" src="mulher-gato.jpg" alt="Mulher-Gato">
                </div>
                <div class="villain-info">
                    <h3 class="villain-name">Mulher-Gato</h3>
                </div>
            </div>

            <!-- Pinguim -->
            <div class="villain-card">
                <div class="villain-img-wrapper">
                    <img class="villain-img" src="pinguim.jpg" alt="Pinguim">
                </div>
                <div class="villain-info">
                    <h3 class="villain-name">Pinguim</h3>
                </div>
            </div>

        </div>
    </section>

    <!-- SCRIPT JS -->
    <script>
        const API_URL = 'https://wayne-tech-api.onrender.com/api';

        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const btn = document.getElementById('btnSubmit');
            const msgErro = document.getElementById('msgErro');

            btn.disabled = true;
            btn.textContent = 'AUTENTICANDO...';
            msgErro.style.display = 'none';

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const data = await response.json();

                if (response.ok) {
                    // Guarda token e usuário no localStorage
                    localStorage.setItem('token', data.token || data.accessToken);
                    localStorage.setItem('usuario', JSON.stringify(data.usuario || data.user || data));
                    
                    // Redireciona para o dashboard
                    window.location.href = 'dashboard.html';
                } else {
                    msgErro.textContent = data.erro || data.mensagem || 'Credenciais inválidas.';
                    msgErro.style.display = 'block';
                }
            } catch (error) {
                console.error('Erro de Login:', error);
                msgErro.textContent = 'Erro ao conectar ao servidor.';
                msgErro.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'AUTENTICAR';
            }
        });
    </script>
</body>
</html>
