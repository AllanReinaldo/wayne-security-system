<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wayne Enterprises - Controle de Acesso</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦇</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>🦇 WAYNE TECH</h1>
            <p>Sistema de Gerenciamento de Segurança</p>

            <div id="error-message" class="alert-error"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">E-mail de Acesso</label>
                    <input type="email" id="email" required placeholder="ex: bruce@wayne.com">
                </div>
                <div class="form-group">
                    <label for="senha">Chave de Segurança (Senha)</label>
                    <input type="password" id="senha" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">AUTENTICAR</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:5000/api";

        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;
            const errorDiv = document.getElementById("error-message");

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, senha })
                });

                const data = await response.json();

                if (!response.ok) {
                    errorDiv.innerText = data.erro || "Erro na autenticação.";
                    errorDiv.style.display = "block";
                    return;
                }

                localStorage.setItem("wayne_token", data.token);
                localStorage.setItem("wayne_user", JSON.stringify(data.usuario));

                window.location.href = "dashboard.html";

            } catch (err) {
                errorDiv.innerText = "Erro de conexão com o servidor Wayne Tech.";
                errorDiv.style.display = "block";
            }
        });
    </script>
</body>
</html>
