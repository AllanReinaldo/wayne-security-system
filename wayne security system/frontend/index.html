<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wayne Tech - Login</title>
    <!-- FAVICON ATUALIZADO -->
    <link rel="icon" type="image/jpeg" href="icone-w.jpeg">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            
            background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url('wayne-enterprises-wallpapers.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            background-attachment: fixed;
        }

        .login-container {
            background: rgba(15, 20, 30, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .logo-batman {
            width: 36px;
            height: 36px;
            border-radius: 50%; /* Mantém a imagem redonda */
            object-fit: cover;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #1ea1e1;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .header p {
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #e2e8f0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(18, 25, 38, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .form-group input:focus {
            border-color: #0284c7;
            background: rgba(18, 25, 38, 0.85);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-primary:hover {
            background: #0369a1;
        }

        .btn-primary:active {
            transform: scale(0.99);
        }

        .error-message {
            display: none;
            background: rgba(239, 68, 68, 0.3);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="header">
            <div class="header-brand">
                <img src="icone-w.jpeg" alt="Logo Wayne Tech" class="logo-batman">
                <h1>WAYNE TECH</h1>
            </div>
            <p>Sistema de Gerenciamento de Segurança</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail de Acesso</label>
                <input type="email" id="email" required placeholder="ex: bruce@wayne.com">
            </div>

            <div class="form-group">
                <label for="senha">Chave de Segurança (Senha)</label>
                <input type="password" id="senha" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-primary">AUTENTICAR</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const errorDiv = document.getElementById('errorMessage');

            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();

                    errorDiv.style.display = 'none';
                    errorDiv.textContent = '';

                    const email = document.getElementById('email').value;
                    const senha = document.getElementById('senha').value;

                    try {
                        const response = await fetch('https://wayne-tech-api.onrender.com/api/login', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ email, senha })
                        });

                        const data = await response.json();

                        if (response.ok) {
                            localStorage.setItem('token', data.token);
                            localStorage.setItem('usuario', JSON.stringify(data.usuario));
                            window.location.href = 'dashboard.html';
                        } else {
                            errorDiv.textContent = data.erro || 'Credenciais inválidas!';
                            errorDiv.style.display = 'block';
                        }
                    } catch (error) {
                        console.error('Erro na requisição:', error);
                        errorDiv.textContent = 'Erro de conexão com o servidor Wayne Tech.';
                        errorDiv.style.display = 'block';
                    }
                });
            }
        });
    </script>
</body>
</html>
