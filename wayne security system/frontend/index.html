<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wayne Enterprises - Controle de Acesso</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦇</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>🦇 WAYNE TECH</h1>
            <p>Sistema de Gerenciamento de Segurança</p>

            <div id="error-message" class="alert-error"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">E-mail de Acesso</label>
                    <input type="email" id="email" required placeholder="ex: bruce@wayne.com">
                </div>
                <div class="form-group">
                    <label for="senha">Chave de Segurança (Senha)</label>
                    <input type="password" id="senha" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">AUTENTICAR</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "https://wayne-tech-api.onrender.com";

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault(); // Impede o recarregamento da página!

    const email = document.getElementById('email').value;
    const senha = document.getElementById('senha').value;
    const errorMessage = document.getElementById('errorMessage'); // ou a div que exibe o erro

    const response = await fetch('https://wayne-tech-api.onrender.com/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, senha })
});

const data = await response.json();

if (response.ok) {
    // 1. Salva o token JWT e as informações do usuário
    localStorage.setItem('token', data.token);
    localStorage.setItem('usuario', JSON.stringify(data.usuario));

    // 2. Redireciona para o painel principal
    window.location.href = 'dashboard.html'; 
} else {
    // Exibe a mensagem de erro retornada pela API Flask
    alert(data.erro || 'Erro ao realizar login.');
}

        // Sucesso no login
        localStorage.setItem('token', data.token);
        localStorage.setItem('usuario', JSON.stringify(data.usuario));
        
        // Redireciona para o dashboard
        window.location.href = 'dashboard.html';

    } catch (error) {
        console.error('Erro na requisição:', error);
        alert('Erro de conexão com o servidor Wayne Tech.');
    }
});
    </script>
</body>
</html>
