<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wayne Enterprises - Access Control</title>
    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="w-azul.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #080b11;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background-image: linear-gradient(rgba(8, 11, 17, 0.88), rgba(8, 11, 17, 0.88)), url('wayne-enterprises-wallpapers.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
            padding: 20px 0;
        }

        .login-wrapper {
            margin: auto 0;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .login-card {
            background: rgba(11, 17, 28, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 8px;
            padding: 35px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-logo-circle {
            width: 50px;
            height: 50px;
            background: #38bdf8;
            color: #080b11;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.6rem;
            margin: 0 auto 10px;
        }

        .brand-header h1 {
            font-size: 1.2rem;
            color: #38bdf8;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .brand-header p {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(8, 11, 17, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 4px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus {
            border-color: #38bdf8;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #38bdf8;
            color: #080b11;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            letter-spacing: 1px;
            transition: background 0.2s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #0284c7;
            color: #ffffff;
        }

        /* --- RODAPÉ --- */
        .footer {
            font-size: 0.8rem;
            color: #64748b;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .footer span {
            color: #cbd5e1;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand-header">
                <div class="brand-logo-circle">W</div>
                <h1>WAYNE ENTERPRISES</h1>
                <p>AUTENTICAÇÃO DE SEGURANÇA</p>
            </div>

            <form onsubmit="autenticarUsuario(event)">
                <div class="form-group">
                    <label for="usuario">Usuário / Perfil</label>
                    <input type="text" id="usuario" placeholder="Bruce, Alfred ou Lucius" required>
                </div>
                <div class="form-group">
                    <label for="senha">Chave de Acesso</label>
                    <input type="password" id="senha" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">ENTRAR NO SISTEMA</button>
            </form>
        </div>
    </div>

    <!-- RODAPÉ DA PÁGINA -->
    <footer class="footer">
        Desenvolvido por: <span>Allan Reinaldo</span>
    </footer>

    <script>
        function autenticarUsuario(event) {
            event.preventDefault();
            
            const usuarioInput = document.getElementById('usuario').value.trim();
            
            // Salva as informações do usuário no localStorage/sessionStorage
            const dadosUsuario = {
                nome: usuarioInput,
                perfil: usuarioInput.toLowerCase()
            };

            localStorage.setItem('usuario', JSON.stringify(dadosUsuario));
            sessionStorage.setItem('usuarioLogado', JSON.stringify(dadosUsuario));

            // Redireciona para o Dashboard
            window.location.href = "dashboard.html";
        }
    </script>
</body>
</html>
