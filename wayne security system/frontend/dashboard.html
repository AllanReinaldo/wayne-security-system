<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wayne Tech - Dashboard de Segurança</title>
    
    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="w-azul.png">

    <!-- ESTILOS GLOBAIS -->
    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050811;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            background-image: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), url('wayne-enterprises-wallpapers.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
        }

        /* BARRA LATERAL (SIDEBAR) */
        .sidebar {
            width: 260px;
            background: rgba(10, 15, 25, 0.95);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .sidebar-brand img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        .sidebar-brand h2 {
            font-size: 1.2rem;
            color: #1ea1e1;
            letter-spacing: 1px;
        }

        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        .nav-item a {
            display: block;
            padding: 12px 16px;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-item.active a, .nav-item a:hover {
            background: rgba(2, 132, 199, 0.2);
            color: #38bdf8;
            border-left: 4px solid #0284c7;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-logout:hover {
            background: #ef4444;
            color: #fff;
        }

        /* CONTEÚDO PRINCIPAL */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header-dashboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        .header-dashboard h1 {
            font-size: 1.8rem;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        .user-status {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .user-status span {
            color: #22c55e;
            font-weight: 600;
        }

        /* CARD DE PAINEL DA GALERIA */
        .panel {
            background: rgba(10, 15, 25, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 25px;
            backdrop-filter: blur(8px);
        }

        .panel-header {
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
        }

        .panel-header h3 {
            color: #f59e0b;
            font-size: 1.2rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* RESPONSIVIDADE */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                padding: 20px;
            }

            .main-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- BARRA LATERAL -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <img src="icone W.jpeg" alt="Logo Wayne Tech">
            <h2>WAYNE TECH</h2>
        </div>

        <ul class="nav-menu">
            <li class="nav-item active"><a href="dashboard.html">Visão Geral</a></li>
            <li class="nav-item"><a href="#vigilante">Modo Vigilante</a></li>
            <li class="nav-item"><a href="#alfred">Modo Alfred</a></li>
        </ul>

        <button class="btn-logout" id="btnLogout">ENCERRAR SESSÃO</button>
    </aside>

    <!-- CONTEÚDO CENTRAL DA PÁGINA -->
    <main class="main-content">
        <header class="header-dashboard">
            <h1>SISTEMA DE GERENCIAMENTO DE SEGURANÇA</h1>
            <div class="user-status">Status: <span>AUTENTICADO</span></div>
        </header>

        <!-- SEÇÃO / PAINEL DOS VILÕES -->
        <section class="panel">
            <div class="panel-header">
                <h3>ARQUIVO DE AMEAÇAS - GOTHAM</h3>
            </div>
            
            <div class="villains-grid">

                <!-- Bane -->
                <div class="villain-card">
                    <div class="villain-img-wrapper">
                        <img class="villain-img" src="viloes/bane.jpg" alt="Bane">
                    </div>
                    <div class="villain-info">
                        <h3 class="villain-name">Bane</h3>
                    </div>
                </div>

                <!-- Charada -->
                <div class="villain-card">
                    <div class="villain-img-wrapper">
                        <img class="villain-img" src="viloes/charada.jpg" alt="Charada">
                    </div>
                    <div class="villain-info">
                        <h3 class="villain-name">Charada</h3>
                    </div>
                </div>

                <!-- Coringa -->
                <div class="villain-card">
                    <div class="villain-img-wrapper">
                        <img class="villain-img" src="viloes/coringa.jpg" alt="Coringa">
                    </div>
                    <div class="villain-info">
                        <h3 class="villain-name">Coringa</h3>
                    </div>
                </div>

                <!-- Corte das Corujas -->
                <div class="villain-card">
                    <div class="villain-img-wrapper">
                        <img class="villain-img" src="viloes/corte-das-corujas.jpg" alt="Corte das Corujas">
                    </div>
                    <div class="villain-info">
                        <h3 class="villain-name">Corte das Corujas</h3>
                    </div>
                </div>

                <!-- Duas-Caras -->
                <div class="villain-card">
                    <div class="villain-img-wrapper">
                        <img class="villain-img" src="viloes/duas-caras.jpg" alt="Duas-Caras">
                    </div>
                    <div class="villain-info">
                        <h3 class="villain-name">Duas-Caras</h3>
                    </div>
                </div>

                <!-- Espantalho -->
                <div class="villain-card">
                    <div class="villain-img-wrapper">
                        <img class="villain-img" src="viloes/espantalho.jpg" alt="Espantalho">
                    </div>
                    <div class="villain-info">
                        <h3 class="villain-name">Espantalho</h3>
                    </div>
                </div>

                <!-- Exterminador -->
                <div class="villain-card">
                    <div class="villain-img-wrapper">
                        <img class="villain-img" src="viloes/exterminador.jpg" alt="Exterminador">
                    </div>
                    <div class="villain-info">
                        <h3 class="villain-name">Exterminador</h3>
                    </div>
                </div>

                <!-- Hera Venenosa -->
                <div class="villain-card">
                    <div class="villain-img-wrapper">
                        <img class="villain-img" src="viloes/hera-venenosa.jpg" alt="Hera Venenosa">
                    </div>
                    <div class="villain-info">
                        <h3 class="villain-name">Hera Venenosa</h3>
                    </div>
                </div>

                <!-- Mulher-Gato -->
                <div class="villain-card">
                    <div class="villain-img-wrapper">
                        <img class="villain-img" src="viloes/mulher-gato.jpg" alt="Mulher-Gato">
                    </div>
                    <div class="villain-info">
                        <h3 class="villain-name">Mulher-Gato</h3>
                    </div>
                </div>

                <!-- Pinguim -->
                <div class="villain-card">
                    <div class="villain-img-wrapper">
                        <img class="villain-img" src="viloes/pinguim.jpg" alt="Pinguim">
                    </div>
                    <div class="villain-info">
                        <h3 class="villain-name">Pinguim</h3>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <!-- SCRIPT DE VERIFICAÇÃO DE AUTENTICAÇÃO E LOGOUT -->
    <script>
        // 1. Proteção de Rota: Verifica se existe o token salvo
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'index.html';
        }

        // 2. Lógica do botão Encerra Sessão (Logout)
        document.getElementById('btnLogout').addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('usuario');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
