<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wayne Tech - Painel de Controle</title>
    <!-- FAVICON ATUALIZADO -->
    <link rel="icon" type="image/png" href="w-azul.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background-color: #0b0e14; 
            color: #ffffff; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            background-image: linear-gradient(rgba(11, 14, 20, 0.85), rgba(11, 14, 20, 0.85)), url('wayne-enterprises-wallpapers.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            background-attachment: fixed;
        }
        
        .navbar { background-color: rgba(18, 24, 36, 0.95); border-bottom: 1px solid #1e293b; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(8px); }
        
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-batman {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .navbar-brand h1 { font-size: 1.25rem; color: #1ea1e1; letter-spacing: 1px; }
        
        .user-info { display: flex; align-items: center; gap: 16px; }
        .user-name { font-size: 0.9rem; color: #cbd5e1; }
        .btn-logout { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .btn-logout:hover { background: #ef4444; color: #ffffff; }

        .container { padding: 32px; max-width: 1200px; margin: 0 auto; width: 100%; }
        .welcome-card { background: rgba(18, 24, 36, 0.9); border: 1px solid #1e293b; border-radius: 12px; padding: 24px; margin-bottom: 24px; backdrop-filter: blur(6px); }
        .welcome-card h2 { color: #ffffff; font-size: 1.5rem; margin-bottom: 8px; }
        .welcome-card p { color: #94a3b8; font-size: 0.95rem; }
        
        .actions-bar { margin-bottom: 24px; display: flex; gap: 12px; }
        .btn-action { background: #1ea1e1; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-action:hover { background: #1682b9; }

        .resources-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .resource-card { background: rgba(18, 24, 36, 0.9); border: 1px solid #1e293b; border-radius: 8px; padding: 20px; position: relative; backdrop-filter: blur(6px); }
        
        .resource-card h3 { 
            font-size: 1.1rem; 
            color: #1ea1e1; 
            margin-bottom: 8px; 
            padding-right: 60px;
        }
        
        .resource-card p { font-size: 0.85rem; color: #cbd5e1; margin-bottom: 12px; }
        .resource-card .tag { display: inline-block; background: #1e293b; color: #94a3b8; font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; }
        
        .btn-delete { position: absolute; top: 16px; right: 16px; background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; transition: all 0.2s; }
        .btn-delete:hover { background: #ef4444; color: #ffffff; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #121824; border: 1px solid #1e293b; padding: 24px; border-radius: 8px; width: 100%; max-width: 400px; }
        .modal-content h3 { color: #1ea1e1; margin-bottom: 16px; }
        .modal-content input { width: 100%; padding: 12px; margin-bottom: 16px; background: #1a2332; border: 1px solid #334155; color: #fff; border-radius: 6px; outline: none; }
        .modal-content input:focus { border-color: #1ea1e1; }
        
        .modal-footer { display: flex; justify-content: flex-end; gap: 12px; }
        
        .btn-cancel { background: #334155; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .btn-cancel:hover { background: #1e293b; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">
            <img src="w-azul.png" alt="Logo Wayne Tech" class="logo-batman">
            <h1>WAYNE TECH</h1>
        </div>
        <div class="user-info">
            <span class="user-name" id="nomeUsuario">Carregando...</span>
            <button class="btn-logout" id="btnLogout">SAIR</button>
        </div>
    </nav>

    <main class="container">
        <section class="welcome-card">
            <h2 id="tituloBoasVindas">Bem-vindo ao Sistema</h2>
            <p id="descricaoPermissao">Nível de acesso em verificação...</p>
        </section>

        <!-- Ações do Administrador e Gerente -->
        <div class="actions-bar" id="actionsBar" style="display: none;">
            <button class="btn-action" id="btnNovoRecurso">+ Criar Novo Recurso</button>
        </div>

        <h3 style="margin-bottom: 16px; color: #cbd5e1; font-weight: 600;">Recursos das Empresas Wayne</h3>
        <section class="resources-grid" id="resourcesGrid">
            <!-- Cards injetados via JS -->
        </section>
    </main>

    <!-- Modal de Criação -->
    <div class="modal" id="modalCriar">
        <div class="modal-content">
            <h3>Novo Recurso</h3>
            <input type="text" id="inputNome" placeholder="Nome do recurso (ex: Batmóvel MK-II)" required>
            <input type="text" id="inputDesc" placeholder="Descrição curta" required>
            <div class="modal-footer">
                <button class="btn-cancel" id="btnCancelarRecurso">Cancelar</button>
                <button class="btn-action" id="btnSalvarRecurso">Salvar</button>
            </div>
        </div>
    </div>

    <script>
        (function verificarAutenticacao() {
            if (!localStorage.getItem('token')) {
                window.location.href = 'index.html';
            }
        })();

        // Base Inicial de Dados
        const recursosIniciais = [
            { id: 1, nome: "Servidores da Batcaverna", desc: "Infraestrutura principal de processamento de dados e IA.", nivel: "admin" },
            { id: 2, nome: "Projeto Batcóptero", desc: "Aeronave tática com modo furtivo avançado.", nivel: "admin" },
            { id: 3, nome: "Rede de Câmeras de Gotham", desc: "Sistema de monitoramento urbano em tempo real.", nivel: "gerente" },
            { id: 4, nome: "Relatórios Comerciais Wayne Enterprises", desc: "Demonstrativos financeiros do último trimestre.", nivel: "gerente" },
            { id: 5, nome: "Estoque de Insumos Wayne Medical", desc: "Inventário de medicamentos e equipamentos hospitalares.", nivel: "funcionario" }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const usuarioSalvo = JSON.parse(localStorage.getItem('usuario') || '{}');
            const role = (usuarioSalvo.role || 'funcionario').toLowerCase();

            document.getElementById('nomeUsuario').textContent = `${usuarioSalvo.nome || 'Usuário'} (${role.toUpperCase()})`;

            const tituloBoasVindas = document.getElementById('tituloBoasVindas');
            const descricaoPermissao = document.getElementById('descricaoPermissao');
            const actionsBar = document.getElementById('actionsBar');

            if (role === 'admin') {
                tituloBoasVindas.textContent = "Painel de Controle Total (Administrador)";
                descricaoPermissao.textContent = "Você possui acesso irrestrito para visualizar, criar e excluir qualquer recurso das Empresas Wayne.";
                actionsBar.style.display = 'flex';
            } else if (role === 'gerente') {
                tituloBoasVindas.textContent = "Painel de Gestão (Gerente)";
                descricaoPermissao.textContent = "Você possui permissão para visualizar e criar novos recursos nas Empresas Wayne.";
                actionsBar.style.display = 'flex';
            } else {
                tituloBoasVindas.textContent = "Painel Operacional (Funcionário)";
                descricaoPermissao.textContent = "Acesso em modo de leitura para acompanhamento de recursos e métricas da empresa.";
            }

            function renderizarRecursos() {
                const grid = document.getElementById('resourcesGrid');
                grid.innerHTML = '';

                let recursos = JSON.parse(localStorage.getItem('recursos_wayne'));
                
                if (!recursos) {
                    recursos = recursosIniciais;
                    localStorage.setItem('recursos_wayne', JSON.stringify(recursos));
                }

                if (role === 'gerente') {
                    recursos = recursos.filter(r => r.nivel !== 'admin');
                } else if (role === 'funcionario') {
                    recursos = recursos.filter(r => r.nivel === 'funcionario');
                }

                recursos.forEach(recurso => {
                    const card = document.createElement('div');
                    card.className = 'resource-card';
                    card.innerHTML = `
                        <h3>${recurso.nome}</h3>
                        <p>${recurso.desc}</p>
                        <span class="tag">Nível: ${recurso.nivel.toUpperCase()}</span>
                        ${role === 'admin' ? `<button class="btn-delete" onclick="excluirRecurso(${recurso.id})">Excluir</button>` : ''}
                    `;
                    grid.appendChild(card);
                });
            }

            window.excluirRecurso = function(id) {
                if (!confirm("Tem certeza que deseja excluir este recurso?")) return;
                
                let recursos = JSON.parse(localStorage.getItem('recursos_wayne')) || recursosIniciais;
                recursos = recursos.filter(r => r.id !== id);
                localStorage.setItem('recursos_wayne', JSON.stringify(recursos));
                renderizarRecursos();
            };

            const modal = document.getElementById('modalCriar');
            const btnNovoRecurso = document.getElementById('btnNovoRecurso');
            const btnCancelarRecurso = document.getElementById('btnCancelarRecurso');

            if (btnNovoRecurso) {
                btnNovoRecurso.addEventListener('click', () => modal.style.display = 'flex');
            }

            if (btnCancelarRecurso) {
                btnCancelarRecurso.addEventListener('click', () => {
                    modal.style.display = 'none';
                    document.getElementById('inputNome').value = '';
                    document.getElementById('inputDesc').value = '';
                });
            }

            modal.addEventListener('click', (e) => { 
                if (e.target === modal) {
                    modal.style.display = 'none';
                    document.getElementById('inputNome').value = '';
                    document.getElementById('inputDesc').value = '';
                }
            });

            document.getElementById('btnSalvarRecurso').addEventListener('click', () => {
                const nome = document.getElementById('inputNome').value;
                const desc = document.getElementById('inputDesc').value;

                if (!nome || !desc) return alert('Por favor, preencha todos os campos!');

                let recursos = JSON.parse(localStorage.getItem('recursos_wayne')) || recursosIniciais;
                recursos.push({
                    id: Date.now(),
                    nome,
                    desc,
                    nivel: role === 'admin' ? 'admin' : 'gerente'
                });

                localStorage.setItem('recursos_wayne', JSON.stringify(recursos));
                modal.style.display = 'none';
                document.getElementById('inputNome').value = '';
                document.getElementById('inputDesc').value = '';
                renderizarRecursos();
            });

            document.getElementById('btnLogout').addEventListener('click', () => {
                localStorage.clear();
                window.location.href = 'index.html';
            });

            renderizarRecursos();
        });
    </script>
</body>
</html>
