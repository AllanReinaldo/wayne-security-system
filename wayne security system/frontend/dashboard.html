<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wayne Tech - Dashboard</title>
    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="w-azul.png">

    <!-- ARQUIVO CSS COM AS REGRAS DA GRADE -->
    <link rel="stylesheet" href="style.css">

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background-color: #000000;
        color: #ffffff;
        min-height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px; 
        
        background-image: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('wayne-enterprises-wallpapers.jpg');
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
        background-attachment: fixed;
    }

    /* CARD DO DASHBOARD (Mantém o mesmo estilo da Login Card) */
    .dashboard-card {
        background: rgba(10, 15, 25, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 16px;
        padding: 40px 35px;
        width: 100%;
        max-width: 1000px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(2, 132, 199, 0.1);
        text-align: center;
    }

    .brand-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 8px;
    }

    .logo-wayne {
        width: 40px !important;
        height: 40px !important;
        max-width: 40px !important;
        max-height: 40px !important;
        border-radius: 50%;
        object-fit: cover;
        background-color: #000;
        mix-blend-mode: multiply;
    }

    .brand-header h1 {
        font-size: 1.6rem;
        color: #1ea1e1;
        letter-spacing: 1.5px;
        font-weight: 700;
    }

    .subtitle {
        color: #94a3b8;
        font-size: 0.85rem;
        margin-bottom: 28px;
        letter-spacing: 0.5px;
    }

    .section-title {
        color: #f59e0b;
        font-size: 1.1rem;
        letter-spacing: 1px;
        margin-bottom: 25px;
        text-transform: uppercase;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 10px;
    }

    /* RESPONSIVIDADE */
    @media (max-width: 480px) {
        .dashboard-card {
            padding: 25px 20px;
        }

        .brand-header h1 {
            font-size: 1.3rem;
        }
    }
</style>
</head>
<body>

    <div class="dashboard-card">
        <div class="brand-header">
            <img src="icone W.jpeg" alt="Logo Wayne Tech" class="logo-wayne">
            <h1>WAYNE TECH</h1>
        </div>
        <p class="subtitle">Sistema de Gerenciamento de Segurança</p>

        <h2 class="section-title">Arquivo de Ameaças - Gotham</h2>

        <!-- GRADE DE VILÕES COM OS CAMINHOS ATUALIZADOS -->
        <div class="villains-grid">

            <!-- Bane -->
            <div class="villain-card">
                <div class="villain-img-wrapper">
                    <img class="villain-img" src="viloes/bane.jpg" alt="Bane">
                </div>
                <div class="villain-info">
                    <h3 class="villain-name">Bane</h3>
                </div>
            </div>

            <!-- Charada -->
            <div class="villain-card">
                <div class="villain-img-wrapper">
                    <img class="villain-img" src="viloes/charada.jpg" alt="Charada">
                </div>
                <div class="villain-info">
                    <h3 class="villain-name">Charada</h3>
                </div>
            </div>

            <!-- Coringa -->
            <div class="villain-card">
                <div class="villain-img-wrapper">
                    <img class="villain-img" src="viloes/coringa.jpg" alt="Coringa">
                </div>
                <div class="villain-info">
                    <h3 class="villain-name">Coringa</h3>
                </div>
            </div>

            <!-- Corte das Corujas -->
            <div class="villain-card">
                <div class="villain-img-wrapper">
                    <img class="villain-img" src="viloes/corte-das-corujas.jpg" alt="Corte das Corujas">
                </div>
                <div class="villain-info">
                    <h3 class="villain-name">Corte das Corujas</h3>
                </div>
            </div>

            <!-- Duas-Caras -->
            <div class="villain-card">
                <div class="villain-img-wrapper">
                    <img class="villain-img" src="viloes/duas-caras.jpg" alt="Duas-Caras">
                </div>
                <div class="villain-info">
                    <h3 class="villain-name">Duas-Caras</h3>
                </div>
            </div>

            <!-- Espantalho -->
            <div class="villain-card">
                <div class="villain-img-wrapper">
                    <img class="villain-img" src="viloes/espantalho.jpg" alt="Espantalho">
                </div>
                <div class="villain-info">
                    <h3 class="villain-name">Espantalho</h3>
                </div>
            </div>

            <!-- Exterminador -->
            <div class="villain-card">
                <div class="villain-img-wrapper">
                    <img class="villain-img" src="viloes/exterminador.jpg" alt="Exterminador">
                </div>
                <div class="villain-info">
                    <h3 class="villain-name">Exterminador</h3>
                </div>
            </div>

            <!-- Hera Venenosa -->
            <div class="villain-card">
                <div class="villain-img-wrapper">
                    <img class="villain-img" src="viloes/hera-venenosa.jpg" alt="Hera Venenosa">
                </div>
                <div class="villain-info">
                    <h3 class="villain-name">Hera Venenosa</h3>
                </div>
            </div>

            <!-- Mulher-Gato -->
            <div class="villain-card">
                <div class="villain-img-wrapper">
                    <img class="villain-img" src="viloes/mulher-gato.jpg" alt="Mulher-Gato">
                </div>
                <div class="villain-info">
                    <h3 class="villain-name">Mulher-Gato</h3>
                </div>
            </div>

            <!-- Pinguim -->
            <div class="villain-card">
                <div class="villain-img-wrapper">
                    <img class="villain-img" src="viloes/pinguim.jpg" alt="Pinguim">
                </div>
                <div class="villain-info">
                    <h3 class="villain-name">Pinguim</h3>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Proteção simples: redireciona se não estiver autenticado
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
