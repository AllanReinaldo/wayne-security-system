<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wayne Tech - Painel de Controle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* BARRA SUPERIOR */
        .navbar {
            background-color: #121824;
            border-bottom: 1px solid #1e293b;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand h1 {
            font-size: 1.25rem;
            color: #f59e0b;
            letter-spacing: 1px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-name {
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background: #ef4444;
            color: #ffffff;
        }

        /* CONTEÚDO PRINCIPAL */
        .container {
            padding: 32px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .welcome-card {
            background: #121824;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .welcome-card h2 {
            color: #ffffff;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .welcome-card p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: #121824;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 20px;
        }

        .card h3 {
            font-size: 0.85rem;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .card .status {
            font-size: 1.25rem;
            font-weight: bold;
            color: #10b981;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">
            <h1>🦇 WAYNE TECH</h1>
        </div>
        <div class="user-info">
            <span class="user-name" id="nomeUsuario">Carregando...</span>
            <button class="btn-logout" id="btnLogout">SAIR</button>
        </div>
    </nav>

    <main class="container">
        <section class="welcome-card">
            <h2>Bem-vindo ao Sistema de Segurança</h2>
            <p>Acesso autorizado. Monitoramento e diretrizes ativas.</p>
        </section>

        <section class="grid">
            <div class="card">
                <h3>Status do Servidor API</h3>
                <div class="status">● OPERACIONAL</div>
            </div>
            <div class="card">
                <h3>Autenticação JWT</h3>
                <div class="status">ATIVADO</div>
            </div>
            <div class="card">
                <h3>Nível de Acesso</h3>
                <div class="status" id="cargoUsuario" style="color: #f59e0b;">AUTORIZADO</div>
            </div>
        </section>
    </main>

    <script>
        // PROTEÇÃO DE ROTA (Executa antes do carregamento completo do HTML)
        (function verificarAutenticacao() {
            const token = localStorage.getItem('token');
            if (!token) {
                // Redireciona imediatamente para o login caso não encontre o token
                window.location.href = 'index.html';
            }
        })();

        document.addEventListener('DOMContentLoaded', () => {
            // Exibição dos dados do usuário logado
            const usuarioSalvo = localStorage.getItem('usuario');
            const nomeElemento = document.getElementById('nomeUsuario');
            const cargoElemento = document.getElementById('cargoUsuario');

            if (usuarioSalvo) {
                try {
                    const usuario = JSON.parse(usuarioSalvo);
                    nomeElemento.textContent = typeof usuario === 'object' ? (usuario.nome || usuario.email) : usuario;
                    if (usuario.role && cargoElemento) {
                        cargoElemento.textContent = usuario.role.toUpperCase();
                    }
                } catch (e) {
                    nomeElemento.textContent = usuarioSalvo;
                }
            } else {
                nomeElemento.textContent = 'Usuário Autenticado';
            }

            // Ação do Botão de Logout
            const btnLogout = document.getElementById('btnLogout');
            if (btnLogout) {
                btnLogout.addEventListener('click', () => {
                    localStorage.removeItem('token');
                    localStorage.removeItem('usuario');
                    window.location.href = 'index.html';
                });
            }
        });
    </script>
</body>
</html>
